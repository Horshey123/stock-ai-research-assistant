[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-ai-data"
version = "0.4.0"
description = "A-share data aggregation and DeepSeek analysis for a personal stock research assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.17.0,<2",
    "baostock>=0.8.9,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pandas>=2.2,<4",
    "uvicorn>=0.30,<1",
]

[project.scripts]
stock-ai-fetch = "stock_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
